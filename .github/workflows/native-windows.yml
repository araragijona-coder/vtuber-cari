name: Native Windows Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'experimental/studio/native-windows/**'
      - 'experimental/studio/core/**'
      - '.github/workflows/native-windows.yml'
  push:
    branches: [main]
    paths:
      - 'experimental/studio/native-windows/**'
      - 'experimental/studio/core/**'
      - '.github/workflows/native-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: experimental/studio/native-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -A x64

      - name: Build native targets
        run: cmake --build build --config Release --parallel

      - name: Run Cari Core smoke test
        run: ctest --test-dir build -C Release --output-on-failure -R cari-core-smoke

      - name: Run FFmpeg supervisor smoke test
        run: ctest --test-dir build -C Release --output-on-failure -R cari-ffmpeg-supervisor-smoke

      - name: Run FFmpeg A/V output smoke test
        run: ctest --test-dir build -C Release --output-on-failure -R cari-ffmpeg-av-output-smoke

      - name: Run raw media adapter smoke test
        run: ctest --test-dir build -C Release --output-on-failure -R cari-raw-media-adapter-smoke

      - name: Run native media output bridge smoke test
        run: ctest --test-dir build -C Release --output-on-failure -R cari-native-media-output-bridge-smoke

      - name: Run audio timeline mixer smoke test
        run: ctest --test-dir build -C Release --output-on-failure -R cari-audio-timeline-mixer-smoke

      - name: Run raw pipe smoke test
        run: ctest --test-dir build -C Release --output-on-failure -R cari-raw-pipe-smoke

      - name: Verify native executable exists
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'build/Release/cari-studio-native.exe'
          if (-not (Test-Path $exe)) {
            throw "Native executable was not produced: $exe"
          }
          Get-Item $exe | Select-Object FullName, Length

      - name: Package portable Windows build
        shell: pwsh
        run: |
          $package = Join-Path $PWD 'build/CariStudio-Windows-x64'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item (Join-Path $PWD 'build/Release/cari-studio-native.exe') (Join-Path $package 'CariStudio.exe') -Force
          @'
          Cari Studio — Windows x64 test build

          This package is intended for the first real Windows hardware test.
          It does not include proprietary assets, Twitch credentials, or FFmpeg binaries.
          The executable reports native Windows capture/audio capabilities and exposes
          the current diagnostic capture path. Hardware-dependent validation remains
          required on the target PC.
          '@ | Set-Content -Path (Join-Path $package 'README.txt') -Encoding UTF8
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath (Join-Path $PWD 'build/CariStudio-Windows-x64.zip') -Force

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CariStudio-Windows-x64
          path: experimental/studio/native-windows/build/CariStudio-Windows-x64.zip
          if-no-files-found: error
