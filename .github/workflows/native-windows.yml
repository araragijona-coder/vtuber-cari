name: Native Windows Prototype

on:
  pull_request:
    branches: [main]
    paths:
      - 'experimental/studio/native-windows/**'
      - 'experimental/studio/core/**'
      - '.github/workflows/native-windows.yml'
  push:
    branches: [main]
    paths:
      - 'experimental/studio/native-windows/**'
      - 'experimental/studio/core/**'
      - '.github/workflows/native-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: experimental/studio/native-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -A x64

      - name: Build native targets
        run: cmake --build build --config Release --parallel

      - name: Run Cari Core smoke test
        run: ctest --test-dir build -C Release --output-on-failure -R cari-core-smoke

      - name: Verify native executable exists
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'build/Release/cari-studio-native.exe'
          if (-not (Test-Path $exe)) {
            throw "Native executable was not produced: $exe"
          }
          Get-Item $exe | Select-Object FullName, Length
