name: Cari Studio Package

on:
  push:
    branches:
      - main
      - "fix/native-windows-foundation"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-source:
    name: Package Cari Studio source
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Prepare package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path $PWD 'experimental/studio'
          if (-not (Test-Path $source)) {
            throw "Cari Studio source directory was not found: $source"
          }

          $packageRoot = Join-Path $PWD 'release/CariStudio'
          $archive = Join-Path $PWD 'release/CariStudio.zip'

          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Copy-Item $source $packageRoot -Recurse -Force

          $head = '${{ github.sha }}'
          $branch = '${{ github.ref_name }}'
          $generated = Get-Date -Format 'yyyy-MM-dd HH:mm:ss K'

          @"
          Cari Studio
          ===========

          Source package generated by GitHub Actions.

          Commit: $head
          Branch: $branch
          Generated: $generated

          This is the current Cari Studio development source tree.
          Native Windows capture/output and avatar runtime remain experimental
          until the project's validation gates are passed.
          "@ | Set-Content -Path (Join-Path $packageRoot 'PACKAGE_INFO.txt') -Encoding UTF8

          New-Item -ItemType Directory -Force -Path (Split-Path $archive) | Out-Null
          Compress-Archive -Path (Join-Path $packageRoot '*') -DestinationPath $archive -Force

          Get-Item $archive | Select-Object FullName, Length

      - name: Upload Cari Studio package
        uses: actions/upload-artifact@v4
        with:
          name: CariStudio-download
          path: release/CariStudio.zip
          if-no-files-found: error
          retention-days: 30
