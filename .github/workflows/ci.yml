name: CI

on:
  push:
    branches: [main, "fix/native-windows-foundation"]
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install -e .[twitch]
      - name: Verify engineering continuity ledger
        run: python experimental/studio/tools/verify_bitacora.py
      - name: Run continuity validator tests
        run: python -m unittest discover -s experimental/studio/tests -p 'test_verify_bitacora.py' -v
      - name: Compile production, experimental and engineering tools
        run: python -m compileall -q app tests experimental tools
      - name: Check Blender VRM pipeline syntax
        run: python -m py_compile experimental/studio/avatar-blender/cari_vrm_pipeline.py
      - name: Validate Blender VRM pipeline config
        run: python -m json.tool experimental/studio/avatar-blender/cari_v1_vrm_pipeline.json > /dev/null
      - name: Check experimental VRM web renderer syntax
        run: node --check experimental/avatar/vrm-web/src/main.js
      - name: Verify Twitch optional bridge import
        run: python -c "from experimental.twitch.twitchio_bridge import CariTwitchBot; print('Twitch bridge import OK')"
      - name: Unit tests
        run: python -m unittest discover -s tests -q
      - name: Validate Cari V1 asset manifests
        run: python experimental/studio/tools/validate_cari_asset.py
      - name: Experimental avatar tests
        run: python -m unittest discover -s experimental -p 'test_*.py' -q
