name: Phase 30-H Exact SHA Validation

on:
  push:
    branches:
      - validation/30-h-exact-sha

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ceb435026c9275d1ddc90a8a29b6a05dfa21f8a1
          fetch-depth: 1

      - name: Verify exact HEAD
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="ceb435026c9275d1ddc90a8a29b6a05dfa21f8a1"
          echo "EXPECTED_SHA=$expected"
          echo "EXECUTED_HEAD=$actual"
          test "$actual" = "$expected"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run mesh deformation regression test
        run: node --test tests/scene_2_5d_mesh_deformation.test.mjs

      - name: Run 30-H attack integration test
        run: node --test tests/scene_2_5d_attack_integration.test.mjs

      - name: Run combat presentation test syntax check
        run: node --check tests/combat_presentation_attack_impact.test.mjs

      - name: Run combat presentation attack impact test
        run: node --test tests/combat_presentation_attack_impact.test.mjs
