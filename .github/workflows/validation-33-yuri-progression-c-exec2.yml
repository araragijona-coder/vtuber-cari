name: Validation 33 Yuri Progression Candidate Exact

on:
  push:
    branches: [validation/33-yuri-progression-c-exec2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: 19dd44c28cc4a14ff622acbc0d94b9e349c5d995
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify exact candidate HEAD
        run: |
          test "$(git rev-parse HEAD)" = "19dd44c28cc4a14ff622acbc0d94b9e349c5d995"
          git rev-parse HEAD
      - name: Syntax checks
        run: |
          node --check intento_2/webapp/js/progression.js
          node --check intento_2/webapp/js/game/rules.js
          node --check intento_2/webapp/js/app.js
          node --check tests/yuri_progression_break_payoff.test.mjs
      - name: Focused Yuri progression tests
        run: node --test tests/yuri_progression_break_payoff.test.mjs
      - name: Full local-equivalent suite
        run: node --test tests/*.test.mjs
