name: Validation 30-H-FIX-16 Exact

on:
  push:
    branches: [validation/30-h-fix-16-exact]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v4
        with:
          ref: 02b2a045cdf1b7ef74fc50ae2c5f362985426ac5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify exact HEAD
        run: |
          test "$(git rev-parse HEAD)" = "02b2a045cdf1b7ef74fc50ae2c5f362985426ac5"
          git rev-parse HEAD
      - name: Node syntax check
        run: node --check tests/combat_presentation_attack_impact.test.mjs
      - name: Combat presentation tests
        run: node --test tests/combat_presentation_attack_impact.test.mjs
