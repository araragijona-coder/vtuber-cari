name: Cari Studio Runner Probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'experimental/studio/electron-shell/**'
      - '.github/workflows/cari-runner-probe.yml'
  push:
    branches:
      - 'fix/native-windows-foundation'
    paths:
      - 'experimental/studio/electron-shell/**'
      - '.github/workflows/cari-runner-probe.yml'

jobs:
  runner:
    runs-on: ubuntu-latest
    steps:
      - name: Runner smoke
        run: |
          echo "GitHub Actions runner reached execution"
          node --version

  shell-syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experimental/studio/electron-shell
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate CommonJS syntax
        run: |
          node --check main.js
          node --check runtime/native-engine.js
          node --check runtime/obs-service.js
          node --check scripts/check-esm.cjs

      - name: Validate renderer ESM syntax
        run: node scripts/check-esm.cjs
