name: Windows Portable Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packager and local TTS
        run: python -m pip install --upgrade pip pyinstaller pyttsx3
      - name: Build Cari.exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Cari --collect-submodules app --collect-all pyttsx3 main.py
      - name: Assemble portable bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle\data | Out-Null
          New-Item -ItemType Directory -Force -Path bundle\assets\cari | Out-Null
          Copy-Item dist\Cari.exe bundle\Cari.exe
          Copy-Item docs\BUILD_WINDOWS.md bundle\BUILD_WINDOWS.md
          @'
          @echo off
          start "" "%~dp0Cari.exe"
          '@ | Set-Content -Encoding ASCII bundle\Abrir-Cari.bat
          @'
          Cari portable build
          Double-click Abrir-Cari.bat or Cari.exe to start the application.
          The current build includes the dependency-light animated fallback avatar.
          On Windows the packaged build enables the local SAPI-backed TTS adapter by default.
          Final PNG/Live2D art and a dedicated anime TTS voice remain separate assets/configuration.
          '@ | Set-Content -Encoding UTF8 bundle\LEEME.txt
      - name: Zip portable bundle
        shell: pwsh
        run: Compress-Archive -Path bundle\* -DestinationPath Cari-Windows-Portable.zip -Force
      - name: Upload portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: Cari-Windows-Portable
          path: Cari-Windows-Portable.zip
          if-no-files-found: error
