name: Phase 18 Semi-Real-Time Combat Validation

on:
  push:
    branches:
      - main
    paths:
      - "intento_2/webapp/**"
      - "tests/**"
      - ".github/workflows/phase18-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Phase 18 real checkout and full test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          echo "GITHUB_SHA=$GITHUB_SHA"
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          echo "git rev-parse HEAD=$ACTUAL_HEAD"
          test "$GITHUB_SHA" = "$ACTUAL_HEAD"

      - name: Verify Phase 18 runtime contract
        shell: bash
        run: |
          set -euo pipefail
          test -f intento_2/webapp/js/game/combat_clock.js
          test -f intento_2/webapp/js/game/auto_attack.js
          test -f intento_2/webapp/js/game/break.js
          test -f intento_2/webapp/js/game/burst.js
          test -f intento_2/webapp/js/game/enemy_behavior.js
          test -f intento_2/webapp/js/game/skill_resolver.js
          node <<'NODE'
          const fs = require("node:fs");
          const index = fs.readFileSync("intento_2/webapp/index.html", "utf8");
          const files = [
            "intento_2/webapp/js/game/combat_clock.js",
            "intento_2/webapp/js/game/auto_attack.js",
            "intento_2/webapp/js/game/break.js",
            "intento_2/webapp/js/game/burst.js",
            "intento_2/webapp/js/game/enemy_behavior.js",
            "intento_2/webapp/js/game/skill_resolver.js"
          ];
          for (const file of files) {
            const source = fs.readFileSync(file, "utf8");
            if (source.includes("Math.random")) throw new Error("Gameplay Math.random: " + file);
          }
          for (const required of [
            "combat-player-hp",
            "combat-player-block",
            "combat-player-auto",
            "combat-energy",
            "combat-energy-regen",
            "combat-enemy-hp",
            "combat-enemy-break",
            "combat-enemy-intent",
            "combat-enemy-auto",
            "combat-time",
            "combat-phase",
            "combat-hand",
            "character-ability"
          ]) {
            if (!index.includes('id="' + required + '"')) throw new Error("Missing UI id: " + required);
          }
          if (index.includes('id="end-turn"')) throw new Error("END TURN control still exists");
          if (!index.includes("./js/game/combat_clock.js")) throw new Error("CombatClock not loaded");
          if (!index.includes("./js/game/auto_attack.js")) throw new Error("AutoAttack not loaded");
          if (!index.includes("./js/game/break.js")) throw new Error("Break not loaded");
          if (!index.includes("./js/game/burst.js")) throw new Error("Burst not loaded");
          console.log("Phase 18 runtime contract: PASS");
          NODE

      - name: Run full Node test suite
        shell: bash
        run: node --test tests/*.test.mjs
