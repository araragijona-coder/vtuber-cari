name: Cari Album Catalog

on:
  push:
    branches: [main, "fix/native-windows-foundation"]
    paths:
      - "assets/cari-album/**/*.png"
      - "assets/cari-album/*.png"
      - "assets/cari-album/README.md"
      - "tools/cari_album_catalog.py"
      - ".github/workflows/cari-album-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate Cari album catalog
        run: python tools/cari_album_catalog.py

      - name: Commit catalog changes
        shell: bash
        run: |
          if git diff --quiet -- assets/cari-album/README.md; then
            echo "Album catalog is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cari-album/README.md
          git commit -m "docs(cari-album): refresh automatic gallery"
          git push
