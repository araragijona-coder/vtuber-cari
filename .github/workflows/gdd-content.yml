name: gdd-content

on:
  push:
    branches:
      - feat/gdd-seed-deck-v2
  pull_request:

jobs:
  gdd-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/gdd_seed_content.test.mjs
