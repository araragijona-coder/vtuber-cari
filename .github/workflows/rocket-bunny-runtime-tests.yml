name: Rocket Bunny Runtime Tests

on:
  push:
    branches: [main]
    paths:
      - "intento_2/webapp/**"
      - "tests/**"
      - ".github/workflows/rocket-bunny-runtime-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "intento_2/webapp/**"
      - "tests/**"
      - ".github/workflows/rocket-bunny-runtime-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run repository tests
        run: node --test tests/*.test.mjs
