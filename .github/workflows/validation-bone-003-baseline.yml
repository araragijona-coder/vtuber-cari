name: Validation BONE-003 Baseline Exact

on:
  push:
    branches: [validation/bone-003-baseline-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact base
        uses: actions/checkout@v4
        with:
          ref: 539f9bc0300142f980440cd2eaa84e750fa8065f
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify exact base
        run: |
          test "$(git rev-parse HEAD)" = "539f9bc0300142f980440cd2eaa84e750fa8065f"
          git rev-parse HEAD
      - name: Syntax checks
        run: |
          node --check intento_2/webapp/js/scene/presentation_events.js
          node --check intento_2/webapp/js/combat_presentation.js
          node --check tests/combat_presentation_attack_impact.test.mjs
      - name: Full test suite
        continue-on-error: true
        run: node --test tests/*.test.mjs
