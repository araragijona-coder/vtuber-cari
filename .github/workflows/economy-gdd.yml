name: economy-gdd

on:
  push:
    branches:
      - feat/economy-progression-gdd-v1
  pull_request:

jobs:
  economy-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/economy_gdd.test.mjs
