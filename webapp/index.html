<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#111318">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Cari WebApp</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main id="app" aria-label="Cari WebApp">
    <section id="combat" aria-label="Combate" style="width:100%;max-width:1100px;margin:0 auto;padding:12px;">
      <div style="width:100%;height:min(72vh,680px);min-height:480px;border-radius:16px;overflow:hidden;background:#080d18;box-shadow:0 12px 36px rgba(0,0,0,.28);">
        <canvas id="combat-canvas" aria-label="Canvas de combate" style="width:100%;height:100%;"></canvas>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0 4px;">
        <button id="simulate-turn" type="button" style="min-height:48px;padding:12px 18px;border:0;border-radius:12px;background:var(--tg-button-color);color:var(--tg-button-text-color);font-weight:700;cursor:pointer;touch-action:manipulation;">
          Simular Turno
        </button>
        <span id="combat-status" role="status" aria-live="polite" style="font-size:13px;color:var(--tg-hint-color);">Esperando CombatInitDTO.</span>
      </div>
    </section>
  </main>
  <script src="./js/scavenged/network_bridge.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/combat.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/scavenged/engine/ui_combat_controller.js"></script>
</body>
</html>
