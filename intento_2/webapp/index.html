<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#111318">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Rocket Bunny Petty · MVP</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main id="app" aria-label="Rocket Bunny Petty">
    <section id="combat" aria-label="Combate">
      <div class="combat-stage">
        <canvas id="combat-canvas" aria-label="Canvas de combate"></canvas>
      </div>

      <div class="combat-controls" aria-label="Acciones de combate">
        <button id="start-battle" type="button">START BATTLE</button>
        <button id="attack-action" type="button" disabled>ATTACK</button>
        <button id="defend-action" type="button" disabled>DEFEND</button>
        <button id="skill-action" type="button" disabled>SKILL</button>
        <button id="restart-battle" type="button" hidden>RESTART</button>
      </div>

      <div class="combat-hud" aria-label="Estado del combate">
        <div class="hud-card">
          <span>PLAYER</span>
          <strong id="combat-player-hp">—</strong>
        </div>
        <div class="hud-card">
          <span>ENEMY</span>
          <strong id="combat-enemy-hp">—</strong>
        </div>
        <div class="hud-card">
          <span>TURN</span>
          <strong id="combat-turn">—</strong>
        </div>
        <div class="hud-card">
          <span>ACTIVE ACTOR</span>
          <strong id="combat-actor">—</strong>
        </div>
        <div class="hud-card">
          <span>LAST ACTION</span>
          <strong id="combat-last-action">—</strong>
        </div>
        <div class="hud-card">
          <span>STATUS</span>
          <strong id="combat-status-value">READY</strong>
        </div>
      </div>

      <p id="combat-result" class="combat-result" role="status" aria-live="assertive"></p>
      <section id="reward-panel" class="reward-panel" hidden aria-label="Recompensa de victoria">
        <strong>REWARD</strong>
        <span>+<b id="reward-xp">0</b> XP</span>
        <span>+<b id="reward-currency">0</b> Currency</span>
        <button id="next-battle" type="button">NEXT BATTLE</button>
      </section>
      <p id="combat-status" class="combat-message" role="status" aria-live="polite">Esperando una batalla.</p>
    </section>
  </main>

  <script src="./js/api.js"></script>
  <script src="./js/game/state.js"></script>
  <script src="./js/game/actions.js"></script>
  <script src="./js/game/rules.js"></script>
  <script src="./js/game/enemy.js"></script>
  <script src="./js/game/rewards.js"></script>
  <script src="./js/combat.js"></script>

  <script src="./js/data/uuid.js"></script>
  <script src="./js/data/schema_validator.js"></script>
  <script src="./js/data/default_database.js"></script>
  <script src="./js/data/database_manager.js"></script>
  <script src="./js/admin/admin_ui.js"></script>
  <script src="./js/storage/save_manager.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
