name: Generate Cari Assets

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Pollinations image model hint"
        required: true
        default: "zimage"
        type: string
      width:
        description: "Output width in pixels"
        required: true
        default: "1024"
        type: string
      height:
        description: "Output height in pixels"
        required: true
        default: "1536"
        type: string
      seed:
        description: "Base seed (-1 for random where supported)"
        required: true
        default: "42"
        type: string
      overwrite:
        description: "Regenerate existing PNG files"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: generate-cari-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate generator syntax
        run: python -m py_compile scripts/generate_cari_assets.py

      - name: Install image normalization dependency
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-assets.txt

      - name: Generate Cari PNG gallery
        run: |
          args=(
            --output-dir assets/cari-gallery
            --model "${{ inputs.model }}"
            --width "${{ inputs.width }}"
            --height "${{ inputs.height }}"
            --seed "${{ inputs.seed }}"
          )
          if [ "${{ inputs.overwrite }}" = "true" ]; then
            args+=(--overwrite)
          fi
          python scripts/generate_cari_assets.py "${args[@]}"

      - name: Show generated assets
        run: |
          echo "Generated gallery:"
          find assets/cari-gallery -maxdepth 1 -type f -name '*.png' -print | sort

      - name: Upload generated gallery
        uses: actions/upload-artifact@v4
        with:
          name: cari-gallery-${{ github.run_number }}
          path: assets/cari-gallery/*.png
          if-no-files-found: error
          retention-days: 14
