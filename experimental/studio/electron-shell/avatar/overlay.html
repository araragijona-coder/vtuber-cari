<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cari Avatar Overlay</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; connect-src 'self';">
  <style>
    html, body, #avatar {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }
    #avatar {
      position: relative;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #action-frame {
      position: absolute;
      left: 50%;
      top: 50%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transform-origin: center center;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="avatar" aria-label="Cari VTuber avatar output overlay">
    <canvas id="canvas"></canvas>
    <img id="action-frame" alt="" draggable="false" hidden>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "../node_modules/three/build/three.module.js",
      "three/addons/": "../node_modules/three/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./overlay-main.js"></script>
</body>
</html>
