<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cari — avatar visual experimental</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #11131a; }
      canvas { display: block; width: 100%; height: 100%; }
      #status { position: fixed; left: 16px; top: 16px; padding: 8px 12px; border-radius: 8px; background: rgba(0,0,0,.65); color: #fff; z-index: 3; }
      #controls { position: fixed; right: 16px; top: 16px; z-index: 3; display: grid; gap: 8px; padding: 10px; border-radius: 10px; background: rgba(0,0,0,.65); }
      #controls label { display: grid; gap: 4px; font-size: 12px; }
      #controls input { max-width: 240px; }
      #play-animation { cursor: pointer; }
      #emotion-slots { position: fixed; left: 16px; bottom: 16px; z-index: 3; display: grid; grid-template-columns: repeat(4, minmax(130px, 1fr)); gap: 10px; max-width: min(720px, calc(100vw - 32px)); }
      .slot { min-height: 82px; padding: 10px; border: 1px dashed rgba(255,255,255,.45); border-radius: 10px; background: rgba(0,0,0,.58); color: #fff; text-align: left; cursor: pointer; }
      .slot strong { display: block; margin-bottom: 4px; }
      .slot small { opacity: .72; }
      .slot.loaded { border-style: solid; }
    </style>
  </head>
  <body>
    <div id="status">Esperando modelo VRM…</div>
    <div id="controls">
      <label>Modelo VRM <input id="model" type="file" accept=".vrm,model/vrm"></label>
      <label>Animación VRMA <input id="animation" type="file" accept=".vrma,model/vrma"></label>
      <button id="play-animation" type="button" disabled>Reproducir VRMA</button>
      <label>Imagen de expresión <input id="emotion" type="file" accept="image/*"></label>
    </div>

    <div id="emotion-slots" aria-label="Espacios para imágenes de Cari por emoción">
      <button class="slot" type="button" data-emotion="neutral"><strong>📷 Cari neutral</strong><small>INSERTAR IMAGEN AQUÍ</small></button>
      <button class="slot" type="button" data-emotion="happy"><strong>😊 Cari feliz</strong><small>PON AQUÍ UNA CARI FELIZ</small></button>
      <button class="slot" type="button" data-emotion="angry"><strong>😠 Cari enojada</strong><small>PON AQUÍ UNA CARI ENOJADA</small></button>
      <button class="slot" type="button" data-emotion="sad"><strong>😢 Cari triste</strong><small>PON AQUÍ UNA CARI TRISTE</small></button>
      <button class="slot" type="button" data-emotion="surprised"><strong>😲 Cari sorprendida</strong><small>PON AQUÍ UNA CARI SORPRENDIDA</small></button>
      <button class="slot" type="button" data-emotion="embarrassed"><strong>😳 Cari avergonzada</strong><small>PON AQUÍ UNA CARI AVERGONZADA</small></button>
      <button class="slot" type="button" data-emotion="sleepy"><strong>😴 Cari dormida</strong><small>PON AQUÍ UNA CARI DORMIDA</small></button>
      <button class="slot" type="button" data-emotion="custom"><strong>✨ Cari personalizada</strong><small>INSERTAR OTRA EXPRESIÓN AQUÍ</small></button>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
