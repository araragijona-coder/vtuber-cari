<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cari — VRM experimental renderer</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #11131a; }
      canvas { display: block; width: 100%; height: 100%; }
      #status { position: fixed; left: 16px; top: 16px; padding: 8px 12px; border-radius: 8px; background: rgba(0,0,0,.65); color: #fff; z-index: 2; }
      #model { position: fixed; right: 16px; top: 16px; z-index: 2; }
    </style>
  </head>
  <body>
    <div id="status">Esperando modelo VRM…</div>
    <input id="model" type="file" accept=".vrm,model/vrm">
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
