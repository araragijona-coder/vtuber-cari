<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Mach-Girls 2.5D Combat Visual Reference</title>
  <desc id="desc">Conceptual design reference showing a layered 2.5D cyberpunk bosozo ku motorcycle combat scene with rider, motorcycle, enemies, telegraph, HUD, cards, energy, break and burst.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071224"/>
      <stop offset="1" stop-color="#160d27"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111627"/>
      <stop offset="0.5" stop-color="#1e2440"/>
      <stop offset="1" stop-color="#111627"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19213b"/>
      <stop offset="1" stop-color="#0e1326"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="80" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 40 L80 0 M-40 40 L40 0 M40 40 L120 0" stroke="#30406b" stroke-width="2" opacity=".25"/>
    </pattern>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <g opacity=".35">
    <rect x="40" y="170" width="90" height="360" fill="#12213e"/>
    <rect x="170" y="110" width="110" height="420" fill="#0e1d37"/>
    <rect x="325" y="210" width="75" height="320" fill="#16284c"/>
    <rect x="450" y="90" width="130" height="440" fill="#0e1932"/>
    <rect x="620" y="170" width="95" height="360" fill="#16264a"/>
    <rect x="760" y="80" width="150" height="450" fill="#101e3b"/>
    <rect x="950" y="150" width="90" height="380" fill="#142543"/>
    <rect x="1090" y="100" width="120" height="430" fill="#0f1d39"/>
    <rect x="1270" y="190" width="85" height="340" fill="#17294e"/>
    <rect x="1400" y="120" width="130" height="410" fill="#0e1d35"/>
  </g>
  <g fill="#4de6ff" opacity=".8" filter="url(#glow)">
    <rect x="70" y="220" width="20" height="5"/><rect x="205" y="180" width="28" height="5"/>
    <rect x="480" y="165" width="34" height="5"/><rect x="790" y="150" width="32" height="5"/>
    <rect x="1120" y="190" width="40" height="5"/><rect x="1430" y="210" width="26" height="5"/>
  </g>

  <!-- FAR PARALLAX -->
  <g opacity=".55">
    <path d="M0 560 L280 520 L520 545 L780 500 L1030 540 L1320 510 L1600 555 L1600 690 L0 690 Z" fill="#1a1f38"/>
    <g fill="#f13cff" opacity=".35">
      <rect x="110" y="560" width="120" height="8"/><rect x="380" y="590" width="90" height="7"/>
      <rect x="920" y="570" width="130" height="8"/><rect x="1260" y="545" width="150" height="8"/>
    </g>
  </g>

  <!-- MIDGROUND -->
  <path d="M0 600 Q400 565 800 610 Q1200 660 1600 610 L1600 1000 L0 1000 Z" fill="url(#road)"/>
  <path d="M0 720 Q400 690 800 735 Q1200 775 1600 735 L1600 1000 L0 1000 Z" fill="url(#grid)" opacity=".7"/>
  <g opacity=".55" stroke="#3aa7c7" stroke-width="5">
    <path d="M0 785 Q390 745 760 795 Q1160 850 1600 790"/>
    <path d="M0 870 Q390 830 760 880 Q1160 930 1600 870"/>
  </g>

  <!-- ENEMIES -->
  <g>
    <g transform="translate(270 470)">
      <ellipse cx="0" cy="95" rx="80" ry="18" fill="#05070e" opacity=".65"/>
      <path d="M-25 35 L0 -35 L25 35 L18 95 L-18 95 Z" fill="#7b4dff"/>
      <circle cy="-55" r="25" fill="#b6f7ff"/>
      <path d="M-50 10 Q0 -25 50 10" fill="none" stroke="#ff5cf4" stroke-width="9"/>
      <text x="-68" y="135" fill="#fff" font-size="22" font-family="Arial">ENEMY A</text>
      <rect x="-80" y="145" width="160" height="14" rx="7" fill="#333b56"/>
      <rect x="-80" y="145" width="124" height="14" rx="7" fill="#ff477a"/>
      <text x="-75" y="182" fill="#d6def7" font-size="16" font-family="Arial">HP / STATUS</text>
    </g>
    <g transform="translate(620 430) scale(.82)">
      <ellipse cx="0" cy="110" rx="85" ry="18" fill="#05070e" opacity=".65"/>
      <path d="M-28 40 L0 -38 L28 40 L20 106 L-20 106 Z" fill="#2bc8ff"/>
      <circle cy="-60" r="28" fill="#b8f8ff"/>
      <path d="M-60 12 Q0 -30 60 12" fill="none" stroke="#3effbb" stroke-width="9"/>
      <text x="-70" y="148" fill="#fff" font-size="22" font-family="Arial">ENEMY B</text>
      <rect x="-82" y="160" width="164" height="14" rx="7" fill="#333b56"/>
      <rect x="-82" y="160" width="95" height="14" rx="7" fill="#ffd34d"/>
      <text x="-78" y="198" fill="#d6def7" font-size="16" font-family="Arial">HP / STATUS</text>
    </g>
    <g transform="translate(1130 370) scale(1.22)">
      <ellipse cx="0" cy="125" rx="105" ry="20" fill="#05070e" opacity=".7"/>
      <path d="M-35 45 L0 -52 L35 45 L28 120 L-28 120 Z" fill="#ff4e8a"/>
      <circle cy="-77" r="34" fill="#d0fbff"/>
      <path d="M-75 0 Q0 -38 75 0" fill="none" stroke="#ffdd54" stroke-width="11"/>
      <text x="-80" y="163" fill="#fff" font-size="24" font-family="Arial">BOSS</text>
      <rect x="-95" y="175" width="190" height="17" rx="8" fill="#333b56"/>
      <rect x="-95" y="175" width="152" height="17" rx="8" fill="#ff3d72"/>
      <text x="-88" y="220" fill="#d6def7" font-size="17" font-family="Arial">HP / BREAK</text>
    </g>
  </g>

  <!-- TELEGRAPH -->
  <g transform="translate(1130 540)">
    <circle r="105" fill="none" stroke="#ffcf4d" stroke-width="8" opacity=".24"/>
    <circle r="76" fill="none" stroke="#ffcf4d" stroke-width="5" opacity=".65"/>
    <path d="M170 -35 L40 0 L170 35 L128 0 Z" fill="#ffcf4d" opacity=".85"/>
    <text x="-88" y="-125" fill="#fff0a6" font-size="22" font-family="Arial" font-weight="700">⚠ INCOMING THREAT</text>
  </g>

  <!-- PLAYER / MOTORCYCLE -->
  <g transform="translate(500 650)">
    <ellipse cx="150" cy="135" rx="250" ry="32" fill="#05070e" opacity=".8"/>
    <!-- speed trail -->
    <g opacity=".55" stroke="#48e7ff" stroke-width="9">
      <path d="M-260 40 L-80 40"/><path d="M-220 75 L-60 75"/><path d="M-250 110 L-70 110"/>
    </g>
    <!-- motorcycle -->
    <g>
      <circle cx="40" cy="120" r="46" fill="#0a0e19" stroke="#49d9ff" stroke-width="8"/>
      <circle cx="255" cy="120" r="46" fill="#0a0e19" stroke="#ff4fd8" stroke-width="8"/>
      <path d="M40 120 L100 60 L195 60 L255 120 L195 105 L100 105 Z" fill="#1a2031" stroke="#7defff" stroke-width="7"/>
      <path d="M98 61 L145 26 L205 60" fill="none" stroke="#ff4fd8" stroke-width="7"/>
      <path d="M170 58 L170 20 L196 8" fill="none" stroke="#7defff" stroke-width="8"/>
      <rect x="118" y="52" width="48" height="18" rx="8" fill="#3e4b6d"/>
    </g>
    <!-- technical rider -->
    <g>
      <path d="M146 44 Q145 0 172 -27 Q198 -47 224 -20 Q245 3 233 38 L223 66 L198 68 L179 65 Z" fill="#212a46" stroke="#bdefff" stroke-width="6"/>
      <circle cx="192" cy="-45" r="25" fill="#c7f7ff" opacity=".85"/>
      <path d="M151 48 L125 100 L145 112 L180 82 L207 88 L235 116 L261 104 L231 46" fill="#2b3657" stroke="#bdefff" stroke-width="6"/>
      <path d="M180 66 L174 110 L214 114 L205 68" fill="#111727" stroke="#ff4fd8" stroke-width="5"/>
    </g>
    <g transform="translate(10 160)">
      <rect width="350" height="64" rx="12" fill="#0a0f1d" stroke="#54dfff" stroke-width="3"/>
      <text x="18" y="25" fill="#80eeff" font-size="17" font-family="Arial" font-weight="700">TECHNICAL CHARACTER PLACEHOLDER</text>
      <text x="18" y="48" fill="#ffd0f4" font-size="15" font-family="Arial">NOT FINAL ART</text>
    </g>
    <g transform="translate(380 55) rotate(-8)">
      <path d="M0 0 C70 0 130 15 175 32" fill="none" stroke="#58eaff" stroke-width="12" opacity=".35"/>
      <path d="M25 -10 C90 0 135 10 170 30" fill="none" stroke="#ff51d6" stroke-width="7" opacity=".65"/>
    </g>
  </g>

  <!-- FOREGROUND FX -->
  <g stroke="#7eeeff" stroke-width="5" opacity=".45">
    <path d="M120 640 L310 470"/><path d="M1320 900 L1520 720"/><path d="M60 940 L260 760"/><path d="M1380 450 L1560 330"/>
  </g>
  <g fill="#ff5fdc" opacity=".8">
    <circle cx="240" cy="790" r="5"/><circle cx="1335" cy="720" r="6"/><circle cx="820" cy="645" r="4"/><circle cx="1010" cy="820" r="5"/>
  </g>

  <!-- HUD -->
  <g font-family="Arial">
    <rect x="520" y="38" width="560" height="108" rx="24" fill="#080d1a" fill-opacity=".92" stroke="#63e9ff" stroke-width="3"/>
    <text x="800" y="72" text-anchor="middle" fill="#9fdfff" font-size="18" letter-spacing="4">COMBAT / LIVE</text>
    <text x="800" y="124" text-anchor="middle" fill="#ffffff" font-size="48" font-weight="700">03:42</text>

    <rect x="72" y="42" width="310" height="96" rx="18" fill="#080d1a" fill-opacity=".88" stroke="#ff59db" stroke-width="3"/>
    <text x="92" y="74" fill="#7deeff" font-size="18">PLAYER / TEAM</text>
    <text x="92" y="108" fill="#ffffff" font-size="27" font-weight="700">RIDER UNIT</text>

    <rect x="1210" y="42" width="310" height="96" rx="18" fill="#080d1a" fill-opacity=".88" stroke="#ffd449" stroke-width="3"/>
    <text x="1230" y="74" fill="#ffe899" font-size="18">THREAT</text>
    <text x="1230" y="108" fill="#ffffff" font-size="27" font-weight="700">BOSS / BREAK</text>

    <!-- bottom identity -->
    <rect x="55" y="830" width="290" height="120" rx="18" fill="#080d1a" stroke="#5fe7ff" stroke-width="3"/>
    <text x="78" y="863" fill="#9fdfff" font-size="16">CHARACTER IDENTITY</text>
    <text x="78" y="899" fill="#ffffff" font-size="26" font-weight="700">TECHNICAL RIDER</text>
    <text x="78" y="928" fill="#ffb6e9" font-size="15">NOT FINAL CHARACTER ART</text>

    <!-- cards -->
    <g transform="translate(380 835)">
      <g>
        <rect width="190" height="105" rx="16" fill="url(#card)" stroke="#4de6ff" stroke-width="3"/>
        <text x="16" y="25" fill="#62efff" font-size="14">ATTACK</text>
        <text x="16" y="51" fill="#ffffff" font-size="20" font-weight="700">CARD / A</text>
        <text x="16" y="75" fill="#c8d3ee" font-size="13">OWNER · ROLE · DMG</text>
        <text x="16" y="94" fill="#7dffcf" font-size="13">⚡ 2 · READY</text>
      </g>
      <g transform="translate(205 0)">
        <rect width="190" height="105" rx="16" fill="url(#card)" stroke="#ff5bdc" stroke-width="3"/>
        <text x="16" y="25" fill="#ff91e6" font-size="14">SKILL</text>
        <text x="16" y="51" fill="#ffffff" font-size="20" font-weight="700">CARD / B</text>
        <text x="16" y="75" fill="#c8d3ee" font-size="13">OWNER · EFFECT · CD</text>
        <text x="16" y="94" fill="#7dffcf" font-size="13">⚡ 3 · READY</text>
      </g>
      <g transform="translate(410 0)">
        <rect width="190" height="105" rx="16" fill="url(#card)" stroke="#ffd34d" stroke-width="3"/>
        <text x="16" y="25" fill="#ffe38b" font-size="14">DEFENSE</text>
        <text x="16" y="51" fill="#ffffff" font-size="20" font-weight="700">CARD / C</text>
        <text x="16" y="75" fill="#c8d3ee" font-size="13">OWNER · BLOCK · CD</text>
        <text x="16" y="94" fill="#7dffcf" font-size="13">⚡ 1 · READY</text>
      </g>
      <g transform="translate(615 0)">
        <rect width="190" height="105" rx="16" fill="url(#card)" stroke="#6cffb7" stroke-width="3"/>
        <text x="16" y="25" fill="#80ffcf" font-size="14">STATUS</text>
        <text x="16" y="51" fill="#ffffff" font-size="20" font-weight="700">CARD / D</text>
        <text x="16" y="75" fill="#c8d3ee" font-size="13">OWNER · BUFF · CD</text>
        <text x="16" y="94" fill="#7dffcf" font-size="13">⚡ 2 · READY</text>
      </g>
    </g>

    <!-- resources -->
    <g transform="translate(1080 835)">
      <rect width="440" height="52" rx="14" fill="#080d1a" stroke="#54e8ff" stroke-width="3"/>
      <text x="18" y="33" fill="#7deeff" font-size="17" font-weight="700">ENERGY</text>
      <rect x="120" y="15" width="200" height="22" rx="11" fill="#27314d"/>
      <rect x="120" y="15" width="168" height="22" rx="11" fill="#46e5ff"/>
      <text x="338" y="33" fill="#ffffff" font-size="16">35 / 40</text>
      <rect y="64" width="440" height="52" rx="14" fill="#080d1a" stroke="#ffcf4d" stroke-width="3"/>
      <text x="18" y="97" fill="#ffe898" font-size="17" font-weight="700">BREAK</text>
      <rect x="120" y="79" width="200" height="22" rx="11" fill="#27314d"/>
      <rect x="120" y="79" width="120" height="22" rx="11" fill="#ffcf4d"/>
      <text x="338" y="97" fill="#ffffff" font-size="16">60 / 100</text>
      <rect y="128" width="440" height="52" rx="14" fill="#080d1a" stroke="#ff65d9" stroke-width="3"/>
      <text x="18" y="161" fill="#ff97e6" font-size="17" font-weight="700">BURST</text>
      <text x="120" y="161" fill="#ffffff" font-size="20" font-weight="700">READY</text>
      <text x="240" y="161" fill="#d8e0f5" font-size="15">visual emphasis</text>
    </g>
  </g>

  <!-- STATE LABELS -->
  <g font-family="Arial" font-weight="700">
    <rect x="58" y="978" width="390" height="18" rx="9" fill="#10172a"/>
    <text x="253" y="992" text-anchor="middle" fill="#8ceeff" font-size="12">CONCEPTUAL DESIGN REFERENCE</text>
    <rect x="482" y="978" width="270" height="18" rx="9" fill="#10172a"/>
    <text x="617" y="992" text-anchor="middle" fill="#ffb9ea" font-size="12">NOT FINAL ART</text>
    <rect x="790" y="978" width="270" height="18" rx="9" fill="#10172a"/>
    <text x="925" y="992" text-anchor="middle" fill="#ffcf75" font-size="12">NOT GAME ASSET</text>
  </g>
</svg>